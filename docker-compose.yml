services:
  postgres:
    image: postgres:16
    container_name: flight-crm-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flightcrm
      POSTGRES_PASSWORD: flightcrm_secret
      POSTGRES_DB: flight_booking_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightcrm -d flight_booking_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
